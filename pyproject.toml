[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "downscaling"
version = "1.0.0"
description = "Downscaling ERA5/CERRA → 1 km pour indices d'assurance paramétrique gel"
authors = [{ name = "Loïc Maurin", email = "loic.maurin@karpos.pro" }]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "numpy>=1.26",
    "xarray>=2024.1",
    "pandas>=2.1",
    "netCDF4>=1.6",
    "zarr>=2.16",
    "rasterio>=1.3",
    "scipy>=1.12",
    "pyproj>=3.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "hydra-core>=1.3",
    # Sencrop bulk loader — supporte local + s3:// via pandas/fsspec
    "fsspec>=2024.1",
    "s3fs>=2024.1",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
    "cartopy>=0.22",
    "jupyter>=1.0",
]
regrid = [
    "xesmf>=0.8",
]

# Pipeline statistique (lapse-rate + QDM) — pas de GPU requis
statistical = [
    "scikit-learn>=1.4",
    # SRTM bootstrap quand le DEM IGN BD ALTI n'est pas fourni (cf. Stage 0
    # du recalibration_pipeline.sh).
    "elevation>=1.1",
    # Requis par Stage 1b (xr.open_mfdataset) du recalibration_pipeline.sh
    # — sinon ImportError au runtime. Observé sur pod 9lom8jtx1rxl5p, 2026-06-16.
    "dask>=2024.1",
    # Sérialisation des objets QDM (Pickle alternative) — requis par
    # downscaling/scripts/calibrate_qdm.py. Sinon ImportError sur --help.
    "joblib>=1.3",
]

# Pipeline deep learning — U-Net FiLM (architecture maison)
dl = [
    "torch>=2.2",
    "torchvision>=0.17",
    "lightning>=2.2",
    "wandb>=0.17",
]

# Infra entraînement pro : monitoring W&B + sync objets Scaleway S3 (cf. docs/infra_pro.md)
cloud = [
    "wandb>=0.17",
    "boto3>=1.34",
]

# Prithvi WxC (NASA/IBM) — foundation model downscaling
# Installation Prithvi WxC depuis GitHub (pas encore sur PyPI)
# pip install 'git+https://github.com/NASA-IMPACT/Prithvi-WxC.git'
prithvi = [
    "torch>=2.2",
    "torchvision>=0.17",
    "lightning>=2.2",
    "huggingface-hub>=0.22",
    "safetensors>=0.4",
    "prithviwxc",            # backbone NASA/IBM (git, cf. [tool.uv.sources])
    # TerraTorch pour fine-tuning (optionnel — inférence sans TerraTorch possible)
    # "terratorch[wxc]>=1.2; python_version>='3.11'",
]

# Documentation — Sphinx + myst-parser pour build docs/ et déploiement Read the Docs
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinxcontrib-bibtex>=2.6",
    "linkify-it-py>=2.0",
]

# Toutes les dépendances pour développement complet
all = [
    "downscaling[statistical,dl,prithvi,docs]",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "cartopy>=0.22",
    "dask>=2024.1",
    "cdsapi>=0.6",           # Téléchargement ERA5/CERRA via CDS API
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
    # Filet local avant push (cf. .pre-commit-config.yaml). La CI exécute déjà
    # ruff check + format --check en bloquant, pre-commit évite juste les
    # aller-retours rouges sur la PR.
    "pre-commit>=3.7",
]

[project.scripts]
downscaling-run      = "downscaling.scripts.run_downscaling:main"
fetch-pretrained     = "downscaling.scripts.fetch_pretrained:main"
run-dl-train         = "downscaling.scripts.run_dl_train:main"
run-dl-inference     = "downscaling.scripts.run_dl_inference:main"
run-calibration      = "downscaling.scripts.run_calibration:main"
launch-dl-job        = "downscaling.scripts.launch_dl_job:main"
run-on-mac           = "downscaling.scripts.run_on_mac:main"
s3-sync              = "downscaling.scripts.s3_sync:main"

[tool.uv]
package = true

[tool.uv.sources]
prithviwxc = { git = "https://github.com/NASA-IMPACT/Prithvi-WxC.git" }

[tool.setuptools.packages.find]
where = ["."]
include = ["downscaling*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Aligné avec karpos-engine (sprint propreté) + SIM de galerne-routing :
# pyflakes (F) + pycodestyle (E/W) + isort (I) + pyupgrade (UP) + bugbear (B)
# + flake8-simplify (SIM) — utile sur code ML pour repérer les patterns
# (if/else collapsibles, dict.get redondants, contextmanagers manquants).
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # line too long — géré par formatter, non bloquant
    "E402",  # module-level import not at top — autorisé dans scripts CLI
    "E701",  # multiple statements on one line — parfois volontaire
    "E702",  # idem (semicolon)
    "B008",  # appel mutable en défaut — idiome FastAPI/Pydantic Field/Hydra
    "B904",  # raise from — dette tech à reprendre dans PR dédiée
    "B905",  # zip strict — idem dette tech
    "B028",  # warn stacklevel — cosmétique
    "F841",  # unused local var — souvent intentionnel (capture pour debug)
    "SIM108",  # ternary instead of if/else — souvent moins lisible en code math
    "SIM117",  # nested with — parfois plus clair non-fusionné
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI / Pydantic / Hydra : `Depends`/`Field`/`MISSING`/… en défaut d'argument
# est l'idiome du framework, pas un B008 (appel mutable). On les déclare immutables.
# Pattern issu de galerne-routing.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "pydantic.Field",
    "hydra.utils.instantiate",
]

[tool.ruff.lint.per-file-ignores]
# Les tests DL importent après `pytest.importorskip(...)` (E402 attendu).
# F401/F841 tolérés en tests : fixtures importées pour le side-effect d'import,
# captures pour debug, variables inutilisées dans setUp.
"tests/*" = ["E402", "F401", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true     # stack scientifique partiellement typée (xarray, rasterio…)
warn_redundant_casts = true
# Typage progressif : on ne vérifie que les fonctions déjà annotées (les corps
# non typés du code numpy/torch ne sont pas encore couverts). À durcir au fil de
# l'eau (check_untyped_defs, puis disallow_untyped_defs par module).
check_untyped_defs = false
exclude = ["tests/", "build/", "dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"

# ---------------------------------------------------------------------------
# Notes d'installation (uv recommandé)
# ---------------------------------------------------------------------------
#
# Pipeline statistique seul :
#   uv sync
#
# + Tout (stat + DL + Prithvi + docs) :
#   uv sync --extra all
#
# Avec Prithvi WxC :
#   uv sync --extra prithvi
#   pip install 'git+https://github.com/NASA-IMPACT/Prithvi-WxC.git'
#
# Sur RunPod (image pytorch:2.x-cuda12.x) :
#   uv sync --extra prithvi --system
#
# Le modèle Prithvi WxC (~9 GB) est cherché dans modelstore/ puis téléchargé
# depuis HuggingFace au premier appel à PrithviWxCDownscaler.from_pretrained().
# Pour pré-télécharger (volume RunPod, CI hors-ligne) :
#   fetch-pretrained                      # → modelstore/
#   DOWNSCALING_MODELSTORE=/workspace/models fetch-pretrained
