[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "downscaling"
version = "0.3.0"
description = "Downscaling ERA5/CERRA → 1 km pour indices d'assurance paramétrique gel"
authors = [{ name = "Loïc Maurin", email = "loic.maurin@karpos.pro" }]
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "numpy>=1.26",
    "xarray>=2024.1",
    "pandas>=2.1",
    "netCDF4>=1.6",
    "zarr>=2.16",
    "rasterio>=1.3",
    "scipy>=1.12",
    "pyproj>=3.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "hydra-core>=1.3",
    # Sencrop bulk loader — supporte local + s3:// via pandas/fsspec
    "fsspec>=2024.1",
    "s3fs>=2024.1",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
    "cartopy>=0.22",
    "jupyter>=1.0",
]
regrid = [
    "xesmf>=0.8",
]

# Pipeline statistique (lapse-rate + QDM) — pas de GPU requis
statistical = [
    "scikit-learn>=1.4",
    # SRTM bootstrap quand le DEM IGN BD ALTI n'est pas fourni (cf. Stage 0
    # du recalibration_pipeline.sh).
    "elevation>=1.1",
]

# Pipeline deep learning — U-Net FiLM (architecture maison)
dl = [
    "torch>=2.2",
    "torchvision>=0.17",
    "lightning>=2.2",
]

# Infra entraînement pro : monitoring W&B + sync objets Scaleway S3 (cf. docs/infra_pro.md)
cloud = [
    "wandb>=0.17",
    "boto3>=1.34",
]

# Prithvi WxC (NASA/IBM) — foundation model downscaling
# Installation Prithvi WxC depuis GitHub (pas encore sur PyPI)
# pip install 'git+https://github.com/NASA-IMPACT/Prithvi-WxC.git'
prithvi = [
    "torch>=2.2",
    "torchvision>=0.17",
    "lightning>=2.2",
    "huggingface-hub>=0.22",
    "safetensors>=0.4",
    "prithviwxc",            # backbone NASA/IBM (git, cf. [tool.uv.sources])
    # TerraTorch pour fine-tuning (optionnel — inférence sans TerraTorch possible)
    # "terratorch[wxc]>=1.2; python_version>='3.11'",
]

# PMAP-LES — modèle LES dynamique (JAX + GT4Py + PHYEX ice3)
# Source : git@github.com:maurinl26/PMAP-LES-shared.git, branche feature_ice3_physics
# Résolu via [tool.uv.sources] ci-dessous
pmap = [
    "pmap",
]

# Toutes les dépendances pour développement complet
all = [
    "downscaling[statistical,dl,prithvi,pmap]",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "cartopy>=0.22",
    "dask>=2024.1",
    "cdsapi>=0.6",           # Téléchargement ERA5/CERRA via CDS API
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
]

[project.scripts]
downscaling-run      = "downscaling.scripts.run_downscaling:main"
fetch-pretrained     = "downscaling.scripts.fetch_pretrained:main"
run-dl-train         = "downscaling.scripts.run_dl_train:main"
run-dl-inference     = "downscaling.scripts.run_dl_inference:main"
run-calibration      = "downscaling.scripts.run_calibration:main"
run-campaign         = "downscaling.scripts.run_campaign:main"
launch-dl-job        = "downscaling.scripts.launch_dl_job:main"
run-on-mac           = "downscaling.scripts.run_on_mac:main"
s3-sync              = "downscaling.scripts.s3_sync:main"

[tool.uv]
package = true

[tool.uv.sources]
prithviwxc = { git = "https://github.com/NASA-IMPACT/Prithvi-WxC.git" }
pmap = { git = "ssh://git@github.com/maurinl26/PMAP-LES-shared.git", branch = "feature_ice3_physics" }
# Variante HTTPS (si SSH non disponible) :
# pmap = { git = "https://github.com/maurinl26/PMAP-LES-shared.git", branch = "feature_ice3_physics" }
# Variante locale (développement simultané des deux repos) :
# pmap = { path = "../PMAP-LES-shared", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["downscaling*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pyflakes (F) + pycodestyle (E/W) + isort (I) + pyupgrade (UP) + bugbear (B).
select = ["E", "F", "W", "I", "UP", "B"]
# E501 (longueur) géré par le formateur ; B008 (appel par défaut) fréquent et sûr ici.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Les tests DL importent après `pytest.importorskip(...)` (E402 attendu).
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true     # stack scientifique partiellement typée (xarray, rasterio…)
warn_redundant_casts = true
# Typage progressif : on ne vérifie que les fonctions déjà annotées (les corps
# non typés du code numpy/torch ne sont pas encore couverts). À durcir au fil de
# l'eau (check_untyped_defs, puis disallow_untyped_defs par module).
check_untyped_defs = false
exclude = ["tests/", "build/", "dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"

# ---------------------------------------------------------------------------
# Notes d'installation (uv recommandé)
# ---------------------------------------------------------------------------
#
# Pipeline statistique seul :
#   uv sync
#
# + PMAP-LES (dynamique LES, branche feature_ice3_physics) :
#   uv sync --extra pmap
#
# + Tout (stat + DL + Prithvi + PMAP) :
#   uv sync --extra all
#
# Développement simultané downscaling + PMAP-LES (local editable) :
#   Décommenter la ligne "pmap = { path = ... }" dans [tool.uv.sources]
#   uv sync --extra pmap
#
# Lancement de la campagne après installation :
#   run-campaign --config runs/campaign/config.yml --source era5land --step all
#
# Ou sans installation via uv run (inline script metadata) :
#   uv run runs/scripts/detect_cold_nights.py --stat-out ... --config ... --out ...
#   uv run runs/scripts/orchestrate.py --config runs/april2021/config.yml --step all
#
# Avec Prithvi WxC :
#   uv sync --extra prithvi
#   pip install 'git+https://github.com/NASA-IMPACT/Prithvi-WxC.git'
#
# Sur RunPod (image pytorch:2.x-cuda12.x) :
#   uv sync --extra prithvi --extra pmap --system
#
# Le modèle Prithvi WxC (~9 GB) est cherché dans modelstore/ puis téléchargé
# depuis HuggingFace au premier appel à PrithviWxCDownscaler.from_pretrained().
# Pour pré-télécharger (volume RunPod, CI hors-ligne) :
#   fetch-pretrained                      # → modelstore/
#   DOWNSCALING_MODELSTORE=/workspace/models fetch-pretrained
