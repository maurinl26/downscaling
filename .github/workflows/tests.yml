name: Tests (pytest)

# Filet de sécurité de la Phase 0 (cf. REFACTORING_ROADMAP.md) :
# lance la suite pytest (indices d'assurance + transfos statistiques) sur
# chaque push et pull request. Pas de GPU ni de réseau requis.

on:
  push:
    branches: [main]
  pull_request:

# Annule les runs en cours sur la même ref si un nouveau push arrive.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # Pipeline statistique (sklearn) + groupe dev (pytest). Pas d'extra dl /
      # prithvi / pmap : la suite Phase 0 ne dépend pas de torch ni de JAX.
      - name: Sync dependencies
        run: uv sync --extra statistical

      - name: Run pytest
        run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (dev tools)
        run: uv sync --extra statistical

      # Ruff lint = garde bloquante (le dépôt doit rester clean).
      - name: Ruff check
        run: uv run ruff check downscaling tests

      # Ruff format = bloquant aussi (depuis sprint propreté). Évite les
      # diff de format à chaque PR + pre-commit ne sert plus à grand-chose
      # si la CI accepte du code non-formatté.
      - name: Ruff format (check only)
        run: uv run ruff format --check downscaling tests

      # mypy bloquant sur le scaffold validation/ (typage propre depuis le
      # début), informatif partout ailleurs (typage progressif, cf.
      # [tool.mypy] : check_untyped_defs=false). Stratégie : durcir
      # module-par-module quand un sous-paquet atteint un typage complet.
      - name: mypy (bloquant sur downscaling/validation/)
        run: uv run mypy downscaling/validation

      - name: mypy (informatif partout)
        run: uv run mypy downscaling || true

  docs-build:
    # Vérifie que la doc Sphinx compile sans erreur sur chaque PR.
    # Évite les régressions silencieuses qui ne se découvriraient qu'au
    # prochain push sur main quand Read the Docs replanterait.
    #
    # Note : on n'utilise pas -W (fail-on-warning) pour l'instant car les
    # docstrings héritées de PyTorch Lightning produisent du bruit
    # (paramref, multiple-dataloaders) qu'on tolère. Durcissement possible
    # plus tard via suppress_warnings dans docs/conf.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      # L'extra [docs] suffit grâce à autodoc_mock_imports dans
      # docs/conf.py (tous les imports lourds sont mockés).
      - name: Sync dependencies (docs extra)
        run: uv sync --extra docs

      - name: Sphinx build
        run: uv run sphinx-build -b html docs docs/_build/html

      # Upload du HTML build comme artefact pour debug rapide en cas de
      # divergence avec ce que Read the Docs produit.
      - name: Upload built docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7
