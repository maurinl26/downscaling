# Read the Docs configuration for karpos-downscaling.
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    # Install uv (fast Python package manager) then sync with docs extra.
    post_install:
      - pip install uv
      - uv pip install --system -e ".[docs,statistical]"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

formats:
  - htmlzip
