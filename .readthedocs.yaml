# Read the Docs configuration for karpos-downscaling.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Format canonical : python.install standard + sphinx.configuration explicite.
# On évite build.jobs.post_install qui empêchait RTD d'utiliser correctement
# notre sphinx.configuration (sphinx était lancé avec . au lieu de docs/).
# L'extra [docs] est tout ce qu'il faut grâce à autodoc_mock_imports dans
# docs/conf.py (les imports torch, sklearn, dask, elevation, etc. sont mockés).

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

formats:
  - htmlzip
